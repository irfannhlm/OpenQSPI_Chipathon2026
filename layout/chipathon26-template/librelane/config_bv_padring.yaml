meta:
  version: 3
  flow: Chip
  substituting_steps:

    # IllegalOverlap bug with PDN halo
    Checker.IllegalOverlap: null

# =============================================================================
# chip_top against the integration team's supplied BV padring.
#
# STATUS: Phase 2 draft - NOT YET RUN. See notes marked [VERIFY].
#
# This differs fundamentally from config.yaml.workshop-orig (kept alongside):
#   old flow -> chip_top.sv *generated* the padring from PAD_NORTH/SOUTH/... lists
#               plus librelane/slots/slot_workshop.yaml
#   new flow -> the padring is a pre-built netlist from Mitch
#               (project_defs/BV/A09_BV_padring.v) that chip_top.sv instantiates,
#               with its physical placement fixed by A09_BV_padring.def.
#
# Because of that, the PAD_* lists and the slot_*.yaml files are no longer used.
# Do not pass a slot yaml on the command line with this config.
# =============================================================================

STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv                          # generated by scripts/gen_chip_top.py
- dir::../project_defs/BV/A09_BV_padring.v         # supplied padring netlist

# NOTE: ../src/chip_core.sv is deliberately absent. The generated chip_top
# instantiates a09_chipathon26_top directly; there is no chip_core level any more.

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# ---- Floorplan --------------------------------------------------------------
# Die and pad placement come from the supplied chip-level padring DEF.
# 2935 x 2935 um, matching A09_BV_padring.cfg (AREA 2935 2935).
FP_SIZING: absolute
DIE_AREA: [0, 0, 2935, 2935]
CORE_AREA: [442, 442, 2493, 2493]

# [VERIFY] variable name against the container's LibreLane before running:
#   docker exec gf180 bash -lc 'grep -rn "DEF_TEMPLATE" \
#     $(python3 -c "import librelane,os;print(os.path.dirname(librelane.__file__))")'
FP_DEF_TEMPLATE: dir::../project_defs/BV/A09_BV_padring.def

# ---- SDC --------------------------------------------------------------------
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# ---- Clock ------------------------------------------------------------------
# Clock enters on bond pad W14 (gf180mcu_fd_io__in_s) and reaches the core on
# the pad's Y terminal, which chip_top names W14_Y.
# [VERIFY] chip_top.sdc still refers to the old clk_PAD / clk_pad/Y names and
# must be updated to match, or STA will constrain nothing.
CLOCK_PORT: W14
CLOCK_NET: W14_Y
CLOCK_PERIOD: 25 # 40 MHz

# ---- Power / ground ---------------------------------------------------------
# In the supplied padring the rails are the slot ports themselves:
#   W12 = VSS (gf180mcu_fd_io__dvss), W13 = VDD (gf180mcu_fd_io__dvdd)
# [VERIFY] whether VDD_NETS/GND_NETS should name VDD/VSS or W13/W12 here -
# depends on how the padring netlist names the rails internally.
VDD_NETS:
- VDD
GND_NETS:
- VSS

# ---- Timing corners ---------------------------------------------------------
DEFAULT_CORNER: max_ss_125C_3v00
STA_CORNERS:
  - nom_tt_025C_3v30
  - min_ff_n40C_3v60
  - max_ss_125C_3v00
  - nom_tt_025C_5v00
  - min_ff_n40C_5v50
  - max_ss_125C_4v50
LIB:
  nom_tt_025C_3v30:
    - "pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib"
    - "pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__tt_025C_3v30.lib"
  min_ff_n40C_3v60:
    - "pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib"
    - "pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ff_n40C_3v63.lib"
  max_ss_125C_3v00:
    - "pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib"
    - "pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ss_125C_2v97.lib"
  nom_tt_025C_5v00:
    - "pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_5v00.lib"
    - "pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__tt_025C_5v00.lib"
  min_ff_n40C_5v50:
    - "pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_5v50.lib"
    - "pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ff_n40C_5v50.lib"
  max_ss_125C_4v50:
    - "pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_4v50.lib"
    - "pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ss_125C_4v50.lib"

# The supplied padring uses gf180mcu_fd_io__bi_t (not bi_24t as the workshop
# slot did). Output-only pins leave Y unconnected; unused slots are filled with
# generated gf180mcu_fd_io__asig_5p0 analog pads that connect to nothing.
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_t
- gf180mcu_fd_io__in_c
- gf180mcu_fd_io__in_s
- gf180mcu_fd_io__asig_5p0

MAX_FANOUT_CONSTRAINT: 16
MAX_CAPACITANCE_CONSTRAINT: 0.4

PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true

DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

# ---- PDN --------------------------------------------------------------------
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

MAGIC_EXT_UNIQUE: notopports

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"

# ---- User macro -------------------------------------------------------------
# [BLOCKER] These view paths do not all exist yet. macros/a09_chipathon26_top/final/
# currently contains only gds/, pnl/, metrics.json and sta.rpt - no lef/, vh/,
# nl/, spef/ or lib/. The macro must be re-hardened (Phase 3) with the BV
# geometry AND with full view export before this config can run.
MACROS:
  a09_chipathon26_top:
    gds:
      - dir::../macros/a09_chipathon26_top/final/gds/a09_chipathon26_top.gds
    lef:
      - dir::../macros/a09_chipathon26_top/final/lef/a09_chipathon26_top.lef
    vh:
      - dir::../macros/a09_chipathon26_top/final/vh/a09_chipathon26_top.vh
    nl:
      - dir::../macros/a09_chipathon26_top/final/nl/a09_chipathon26_top.nl.v
    spef:
      "max_*":
        - dir::../macros/a09_chipathon26_top/final/spef/max/a09_chipathon26_top.max.spef
      "min_*":
        - dir::../macros/a09_chipathon26_top/final/spef/min/a09_chipathon26_top.min.spef
      "nom_*":
        - dir::../macros/a09_chipathon26_top/final/spef/nom/a09_chipathon26_top.nom.spef
    lib:
      "nom_tt_025C_5v00":
        - dir::../macros/a09_chipathon26_top/final/lib/nom_tt_025C_5v00/a09_chipathon26_top__nom_tt_025C_5v00.lib
      "min_ff_n40C_5v50":
        - dir::../macros/a09_chipathon26_top/final/lib/min_ff_n40C_5v50/a09_chipathon26_top__min_ff_n40C_5v50.lib
      "max_ss_125C_4v50":
        - dir::../macros/a09_chipathon26_top/final/lib/max_ss_125C_4v50/a09_chipathon26_top__max_ss_125C_4v50.lib
      "nom_tt_025C_3v30":
        - dir::../macros/a09_chipathon26_top/final/lib/nom_tt_025C_3v30/a09_chipathon26_top__nom_tt_025C_3v30.lib
      "min_ff_n40C_3v60":
        - dir::../macros/a09_chipathon26_top/final/lib/min_ff_n40C_3v60/a09_chipathon26_top__min_ff_n40C_3v60.lib
      "max_ss_125C_3v00":
        - dir::../macros/a09_chipathon26_top/final/lib/max_ss_125C_3v00/a09_chipathon26_top__max_ss_125C_3v00.lib
    instances:
      # Instance name comes from the generated chip_top.sv (u_core), NOT the old
      # i_chip_core.a09_inst hierarchy.
      # Location is the block origin from A09_BV_interface.yaml: origin_microns.
      u_core:
        location: [350, 1475]
        orientation: N

PDN_MACRO_CONNECTIONS:
- "u_core VDD VDD VSS VSS"

FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl
