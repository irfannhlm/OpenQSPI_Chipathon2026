meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: a09_chipathon26_top
VERILOG_FILES:
- dir::a09_chipathon26_top.sv
- dir::../../../../rtl/qspi_master.sv
- dir::../../../../rtl/fifo.sv
- dir::../../../../rtl/apb_qspi.sv
- dir::../../../../rtl/uart_simple.sv
- dir::../../../../rtl/uart_to_apb.sv

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::a09_chipathon26_top.sdc
SIGNOFF_SDC_FILE: dir::a09_chipathon26_top.sdc
FALLBACK_SDC: dir::a09_chipathon26_top.sdc

# Core sizing
FP_SIZING: absolute
DIE_AREA:  [0, 0, 700, 700]

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Clock
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 20 # 50 MHz

# Yosys synthesis options
SYNTH_MAX_FANOUT: 16
SYNTH_STRATEGY: "DELAY 4"
SYNTH_SIZING: true
SYNTH_ABC_BUFFERING: true

# Optimize setup and hold timing
RUN_POST_CTS_RESIZER_TIMING: true
RUN_POST_GRT_RESIZER_TIMING: true
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 50
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 50
PL_RESIZER_SETUP_SLACK_MARGIN: 1.5
GRT_RESIZER_SETUP_SLACK_MARGIN: 1.5
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Optimize slew and cap timing
RUN_POST_GRT_DESIGN_REPAIR: true
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 30
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 30

# Target density for placement
PL_TARGET_DENSITY_PCT: 65
GRT_ALLOW_CONGESTION: true
RT_MAX_LAYER: Metal4

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: False 
PDN_CORE_RING_CONNECT_TO_PADS: False 
PDN_ENABLE_PINS: True 

PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3