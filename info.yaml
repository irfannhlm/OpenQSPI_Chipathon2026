# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Fully Configurable 32-bit QSPI Master Controller"
  team: "A09 Crispi"
  discord: "Irfan"
  description: "A fully configurable QSPI controller wrapped with High-Speed UART interface"
  lvs_config: "lvs_config.json"
  gf_def_ready: true
  ws_def_ready: false
  drc_ready: true
  lvs_ready: true

pins:
  - name: VSS
    io_type: ground
  - name: VDD
    io_type: power
  - name: clk
    io_type: input_schmitt
  - name: rst_n
    io_type: input_cmos
  - name: uart_rx
    io_type: input_cmos
  - name: uart_tx
    io_type: bidirectional # configured at 8mA (lower drive)
  - name: qspi_csn[0]
    io_type: bidirectional # configured at 12mA
  - name: qspi_csn[1]
    io_type: bidirectional # configured at 12mA
  - name: qspi_sck
    io_type: bidirectional # configured at 16mA (higher drive)
  - name: qspi_io[0]
    io_type: bidirectional # configured at 16mA (higher drive)
  - name: qspi_io[1]
    io_type: bidirectional # configured at 16mA (higher drive)
  - name: qspi_io[2]
    io_type: bidirectional # configured at 16mA (higher drive)
  - name: qspi_io[3]
    io_type: bidirectional # configured at 16mA (higher drive)

